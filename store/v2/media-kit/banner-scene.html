<!DOCTYPE html>
<!-- Bannière Chrome Web Store 1544×500 — compose la capture réelle newtab-mosaic. -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Outfit';
    src: url('../assets/fonts/outfit-var.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1544px; height: 500px; overflow: hidden; }
  body {
    font-family: 'Outfit', -apple-system, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 72px;
    background:
      linear-gradient(90deg, rgba(4, 8, 15, 0.88) 0%, rgba(4, 8, 15, 0.42) 62%, rgba(4, 8, 15, 0.30) 100%),
      url('../assets/wallpapers/hero-bg.jpg') center 38% / cover no-repeat,
      #060b14;
  }
  .txt { flex: 0 0 640px; }
  .eyebrow {
    font-size: 20px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: #9cc4f5; margin-bottom: 18px;
  }
  h1 { font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; }
  h1 em { font-style: normal; color: #7ab5ff; }
  .sub { font-size: 26px; color: #d6e2f2; margin-top: 20px; line-height: 1.35; }
  .shot {
    flex: 1; height: 434px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 18px 44px rgba(0,0,0,0.35);
    background: #fff;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
</style>
</head>
<body>
  <div class="txt">
    <div class="eyebrow">Extension Chrome — Gratuit</div>
    <h1>Chaque nouvel onglet, un nouvel <em>outil</em> à découvrir.</h1>
    <div class="sub">Les derniers outils et pépites de mondary.design, en mosaïque.</div>
  </div>
  <div class="shot"><img src="../screenshots/newtab-mosaic-1280x800@2x.png" alt=""></div>
</body>
</html>
