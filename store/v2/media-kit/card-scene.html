<!DOCTYPE html>
<!-- Card sociale 1200×630 (OG / partages) — compose la capture réelle newtab-mosaic. -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Outfit';
    src: url('../assets/fonts/outfit-var.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Outfit', -apple-system, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 44px 80px 36px;
    background:
      linear-gradient(180deg, rgba(4, 8, 15, 0.82), rgba(4, 8, 15, 0.62)),
      url('../assets/wallpapers/hero-bg.jpg') center 40% / cover no-repeat,
      #060b14;
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .brand img { width: 58px; height: 58px; border-radius: 13px; }
  .brand span { font-size: 30px; font-weight: 700; }
  h1 { font-size: 56px; line-height: 1.07; font-weight: 700; letter-spacing: -0.02em; max-width: 920px; }
  h1 em { font-style: normal; color: #7ab5ff; }
  .sub { font-size: 25px; color: #d6e2f2; margin-top: 18px; }
  .shot {
    margin-top: 32px; width: 560px; height: 230px; border-radius: 12px;
    overflow: hidden; box-shadow: 0 14px 34px rgba(0,0,0,0.35); background: #fff;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
</style>
</head>
<body>
  <div class="brand"><img src="logo.png" alt=""><span>PK New Tab</span></div>
  <h1>Chaque nouvel onglet, un nouvel <em>outil</em> à découvrir.</h1>
  <div class="sub">Gratuit · Chrome · aucune donnée collectée</div>
  <div class="shot"><img src="../screenshots/newtab-mosaic-1280x800@2x.png" alt=""></div>
</body>
</html>
